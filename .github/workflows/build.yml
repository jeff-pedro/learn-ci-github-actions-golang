name: Construção do Artefato

on:
  # push:
  #   branches: [ "main" ]
  pull_request:

  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        go_version: ['1.22']
        os: ['ubuntu-latest']
    steps:
      - uses: actions/checkout@v4

      - name: Configuração do Go
        uses: actions/setup-go@v3
        with:
          go-version: ${{ matrix.go_version }}

      - name: Build
        run: go build -v main.go

      - name: Upload e Construção do Artefato
        uses: actions/upload-artifact@v3.1.0
        with:
          name: programa
          path: main

  docker:
    needs: build
    uses: ./.github/workflows/docker.yml
    secrets: inherit
    