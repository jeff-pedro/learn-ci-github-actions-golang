name: Entrega Contínua EC2

on:
  workflow_call:

jobs:

  ec2:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
           go-version: '1.22'

      - name: Download do artefato
        uses: actions/download-artifact@v4
        with:
          name: programa

      - name: SCP para EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SECRET_KEY }}
          source: "templates,assets,main"
          target: /home/${{ secrets.EC2_USERNAME }}

      - name: Copia Serviço para EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SECRET_KEY }}
          source: "projeto.service"
          target: /lib/systemd/system/api-go.service

      - name: Reinicia Projeto Go
        uses: appleboy/ssh-action@master
        env:
          DB_HOST: ${{ secrets.RDS_HOST }}
          DB_USER: ${{ secrets.RDS_USER }}
          DB_NAME: ${{ secrets.RDS_DBNAME }}
          DB_PASSWORD: ${{ secrets.RDS_PASSWORD }}
          DB_PORT: ${{ secrets.RDS_PORT }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SECRET_KEY }}
          envs: DB_HOST,DB_USER,DB_NAME,DB_PASSWORD,DB_PORT
          script: |

            # Cria diretório se não existir
            sudo mkdir -p /etc/api-go

            # Adiciona as variáveis no arquivo
            sudo echo "DB_HOST=$DB_HOST" | sudo tee /etc/api-go/db.env > /dev/null
            sudo echo "DB_USER=$DB_USER" | sudo tee -a /etc/api-go/db.env > /dev/null
            sudo echo "DB_NAME=$DB_NAME" | sudo tee -a /etc/api-go/db.env > /dev/null
            sudo echo "DB_PASSWORD=$DB_PASSWORD" | sudo tee -a /etc/api-go/db.env > /dev/null
            sudo echo "DB_PORT=$DB_PORT" | sudo tee -a /etc/api-go/db.env > /dev/null

            # Protege o arquivo
            sudo chmod 600 /etc/api-go/db.env

            # Habilita e Reinicia o serviço
            sudo systemctl enable api-go.service
            sudo systemctl daemon-reload
            sudo systemctl restart api-go.service
